plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
    id "io.github.intisy.online-gradle" version "1.7.2" apply false
    id "io.github.intisy.github-gradle" version "1.8.2.1" apply false
}

// online-gradle's `online {}` preset block is intended for single-module repos (see
// docker-java's root build.gradle). Applying it project-wide breaks subproject
// configuration in this multi-module layout, so it stays declared (apply false) but
// unapplied. If it is ever needed, apply it per-module rather than at the root.

subprojects {
    apply plugin: "java-library"
    apply plugin: "com.github.johnrengelman.shadow"
    apply plugin: "io.github.intisy.github-gradle"
    apply plugin: "maven-publish"

    group = artifact_group
    // publishGithub (used by the publish-dependency workflow) requires a concrete version.
    // Derive it from -Partifact_version=<tag> passed by CI (stripping a leading "v"), falling back
    // to a local dev version. build.yml doesn't need this (it uses the gh CLI directly).
    version = (project.findProperty("artifact_version") ?: "0.0.0-dev").toString().replaceFirst(/^v/, "")

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        // 17 is which JDK COMPILES; options.release = 8 below is which JVM RUNS the output. The
        // floor is 17 because TeaVM 0.15.0's artifacts publish minimum-JVM metadata above 8.
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All Java source, main and test alike, must stay within the JDK 1.8 API surface; javac enforces it.
    tasks.matching { it.name == "compileJava" || it.name == "compileTestJava" }.configureEach {
        options.release = 8
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    }

    test {
        useJUnitPlatform()
    }

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
    }

    // ai-java is multi-module but only :jvm is a published/consumable artifact (it re-exports
    // :routing + :accounts via `api` and shades them into its standalone jar). The reusable
    // `publish-dependency` workflow runs `./gradlew publish`, which fans `publishGithub` out to
    // EVERY subproject; the non-library modules (:routing, :accounts, :examples, :example-server,
    // teavm modules) have no publishGithub artifacts and would fail. Scope the task to :jvm so the
    // aggregate publish succeeds by publishing only the library artifact.
    tasks.matching { it.name == "publishGithub" }.configureEach {
        onlyIf { project.path == ":jvm" }
    }

    // GitHub Packages Maven repository, shared across every subproject so a plain `./gradlew
    // publish` resolves it. Only :jvm actually declares a `publishing.publications` block (see
    // jvm/build.gradle); subprojects with no publication just get a no-op publish, mirroring the
    // publishGithub onlyIf-scoping above.
    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/intisy-ai/ai-java"
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
                    password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token")
                }
            }
        }
    }
}
