name: Publish to GitHub Packages
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Publishes the immutable io.github.intisy:ai-java:<version> coordinate to GitHub Packages
      # Maven (see jvm/build.gradle's publishing block). This is separate from build.yml's
      # github-gradle release, which stays in place for now.
      - name: Publish ai-java to GitHub Packages
        run: ./gradlew publish -Partifact_version=${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
