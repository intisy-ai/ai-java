dependencies {
    // basekit/proxy's routing engine (SPIs, Router/ModelMap/RateLimit, Provider SPI,
    // HandlerResolver/HandlerResolvers) and basekit/auth's account engine (AccountManager,
    // OAuthConfig, AccountStore), each resolved through github-gradle as a release-asset jar.
    // api (not implementation): AiJava's own public API exposes these types directly
    // (router(RoutingProfile, HandlerResolver, ...), accountManager(...) -> AccountManager).
    githubApi "intisy-ai:basekit:4.2.0:routing"
    // The routing vocabulary :routing exports (RoutingProfile, HandlerResolver), named here because
    // a release-asset jar carries no transitive metadata.
    githubApi "intisy-ai:basekit:4.2.0:proxy-contracts"
    githubApi "intisy-ai:basekit:4.2.0:accounts"
    // The provider vocabulary ProviderRegistry discovers implementations of. api, not
    // implementation: it appears in this module's own public surface.
    githubApi "intisy-ai:basekit:4.2.0:auth-contracts"
    // api's portable seam implementations. The HOST carries them so a provider jar can compileOnly
    // them and stay thin, rather than every jar embedding its own copy.
    githubApi "intisy:bayonet:1.7.0:seam"
    // The seam INTERFACES those implement, which a release-asset jar does not export transitively.
    // api for the same reason as the rest: AiJava's own signatures name them.
    githubApi "intisy:bayonet:1.7.0:contract"
    // api's JVM seam implementations (FileStore, JdbcStore, GsonJsonCodec and friends).
    // api, not implementation: Storage and AiJava.builder() name them.
    githubApi "intisy:bayonet:1.7.0:jvm-seam"
    // basekit/ir's IR types, on the RUNTIME classpath (not compileOnly like :routing's own
    // dependency on it). :jvm is the HOST -- ProviderRegistry loads thin provider jars (compileOnly
    // :ir, no ir.* classes bundled) on a URLClassLoader parented to this module's own classloader
    // (see ProviderRegistry#fromDirectory), so a provider's handleIr resolving io.github.intisy.
    // ai.ir.IrRequest/IrResponse at runtime depends on THIS classpath actually carrying :ir's
    // classes for that parent-first delegation to find. implementation (not api): TranslatorRegistry
    // (also part of :jvm's public surface) DOES return Translator, but that stays an explicit,
    // deliberate opt-in -- a consumer that never touches translators shouldn't inherit :ir
    // transitively just for using ProviderRegistry/handlers. Consumers that DO use
    // TranslatorRegistry declare their own project(":ir"), as example-server does.
    githubImplementation "intisy-ai:basekit:4.2.0:ir"
    api "com.google.code.gson:gson:2.10.1"
    // Test-only: JdbcStoreTest exercises JdbcStore against a real H2 in-memory DataSource.
    // H2 is NOT a runtime dependency of the library - JdbcStore takes a javax.sql.DataSource
    // that the server provides (H2/MySQL/PostgreSQL/SQLite are all supported at runtime).
    // api's seam implementations, for the NoopLogger the router tests inject.
    githubTestImplementation "intisy:bayonet:1.7.0:seam"
    testImplementation "com.h2database:h2:2.2.224"
    // Test-only: proves JdbcStore's SQLite dialect handling (no FOR UPDATE support) against a
    // real SQLite file DataSource, same rationale as the H2 dependency above.
    testImplementation "org.xerial:sqlite-jdbc:3.45.3.0"
}

// Match docker-java's "standalone" naming for the shaded jar (Shadow's own
// default classifier is "all"); the plain jar keeps no classifier.
// Keep the jar filenames version-LESS (jvm.jar / jvm-standalone.jar) even though project.version
// is now set (for publishGithub's package version): publishGithub's artifacts block references
// build/libs/jvm.jar by that exact name, and the uploaded asset is renamed to ai-java.jar from
// `repo` anyway, so the local filename just has to be findable/stable.
jar {
    archiveVersion = ""
}

shadowJar {
    archiveClassifier = "standalone"
    archiveVersion = ""
}

// The consumable Maven Central-style coordinate for the whole library. shadowJar bundles
// :routing + :accounts (api deps) and :ir (implementation dep) into one jar, so consumers get
// io.github.intisy.ai.shared.spi.* (Provider/HandlerCtx SPI), io.github.intisy.ai.shared.select.*
// (QuotaHealth), io.github.intisy.ai.jvm.backend.* and the IR types from a single dependency,
// replacing the generic-named io.github.intisy:accounts / io.github.intisy:jvm coordinates and
// the pinned githubCompileOnly "intisy-ai:ai-java:<v>:standalone" fetch-from-release model.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "ai-java"
            artifact(shadowJar) {
                classifier = null
            }
            pom {
                name = display_name
                description = artifact_description
            }
        }
    }
}

publishGithub {
    // :jvm is a subproject with no .git of its own, so publishGithub's default git-remote lookup
    // fails ("No git remote 'origin' found in .../jvm"). Set owner/repo explicitly to bypass it.
    // These also drive the uploaded asset names: the package publishes as ai-java.jar /
    // ai-java-standalone.jar (from `repo`), which is what `githubApi "intisy-ai:ai-java:<v>"`
    // consumers resolve (the source jar filenames below stay jvm*.jar; they're renamed on upload).
    owner = "intisy-ai"
    repo = "ai-java"
    releaseName = "Release ${project.findProperty('artifact_version') ?: project.version}"
    // Multi-module release artifacts are aggregated at the repo level;
    // here we just ensure this module builds a plain jar + a standalone shaded jar.
    artifacts {
        artifact {
            classifier = ""
            jar = file("build/libs/jvm.jar")
        }
        artifact {
            classifier = "standalone"
            jar = file("build/libs/jvm-standalone.jar")
        }
    }
}
