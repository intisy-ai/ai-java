// Runnable, never-published example HTTP server over :jvm's WiredRouter. Declares NO publishGithub
// block (demo, not a release artifact). Mirrors :examples' provider-jar staging so a real request
// routes through a jar-discovered provider with zero classpath coupling.
apply plugin: "application"

dependencies {
    // Consume :jvm's public facade (it re-exports :routing + :accounts via `api`).
    implementation project(":jvm")
    // core-ir's IR types + the Translator interface, needed directly since :jvm's own :ir
    // dependency is `implementation` (non-transitive); implementations load from jars at runtime.
    githubImplementation "intisy-ai:core-ir:1.4.0:ir"
    // The seam interfaces the line above used to export transitively.
    githubImplementation "intisy-ai:api:1.7.0:contract"
    // api's seam implementations, for the NoopLogger the admin tests inject.
    githubTestImplementation "intisy-ai:api:1.7.0:seam"
    // A provider jar declares its first-party deps compileOnly so it stays thin, which makes
    // supplying them the HOST's job (the same reason :ir is declared above). The org provider
    // jars the e2e test stages name a vendor translator directly, and a ServiceLoader entry on
    // disk cannot satisfy that: the class has to be on the classloader the jar loads under.
    githubTestImplementation "intisy-ai:anthropic-translator:1.2.0:anthropic"
    githubTestImplementation "intisy-ai:gemini-translator:1.2.0:gemini"
    // Deliberately NO project(":examples-provider") dependency: the provider is discovered from
    // its jar on disk via ServiceLoader; putting it on the classpath would mask jar loading.
    // Default store backend: a real JDBC driver so ServerMain's default `sqlite` store (via
    // Storage.jdbc) persists across restarts. Must be on the runtime classpath, not just test.
    implementation "org.xerial:sqlite-jdbc:3.45.3.0"
}

application {
    mainClass = "io.github.intisy.ai.exampleserver.ServerMain"
}

// Windows javac defaults to windows-1252, which corrupts non-ASCII string literals; pin UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// Stage :examples-provider's built jar into a providers/ directory, as a server operator would
// drop a provider jar into a plugins folder. Only the `test` task depends on this: the
// integration tests route through the echo provider and need it staged. A real `run` must start
// with NO fake providers (see ServerMain), so it points at a clean, never-staged directory instead.
def providersDir = layout.buildDirectory.dir("providers")
def stageProviders = tasks.register("stageProviders", Copy) {
    from(project(":examples-provider").tasks.named("jar"))
    into(providersDir)
}

// Stage :examples-translator's built jar into a translators/ directory, exactly like
// stageProviders above -- TranslatorRegistry (see ServerProfile, MessagesAdmin) discovers it
// from disk via ServiceLoader, never from a compile-time dependency on the translator module.
def translatorsDir = layout.buildDirectory.dir("translators")
def stageTranslators = tasks.register("stageTranslators", Copy) {
    from(project(":examples-translator").tasks.named("jar"))
    into(translatorsDir)
}

def runProvidersDir = layout.buildDirectory.dir("run-providers")
def runProxiesDir = layout.buildDirectory.dir("run-proxies")
// Never staged by design (no installer seam yet): a real `run` serves 503 no_translator for
// every console chat send until an operator drops a translator jar here themselves.
def runTranslatorsDir = layout.buildDirectory.dir("run-translators")

tasks.named("run") {
    systemProperty("exampleserver.providersDir", runProvidersDir.get().asFile.absolutePath)
    systemProperty("exampleserver.proxiesDir", runProxiesDir.get().asFile.absolutePath)
    systemProperty("exampleserver.translatorsDir", runTranslatorsDir.get().asFile.absolutePath)
}

tasks.named("test") {
    dependsOn(stageProviders)
    dependsOn(stageTranslators)
    systemProperty("exampleserver.providersDir", providersDir.get().asFile.absolutePath)
    systemProperty("exampleserver.translatorsDir", translatorsDir.get().asFile.absolutePath)
    // The two REAL provider jars (antigravity/claude) are pre-built out-of-band in their own
    // repos (ai-java cannot includeBuild them) and staged here manually. Default to
    // build/orgProviders (empty in CI); the e2e test skips via Assumptions when the jars aren't
    // present. Override with -PorgProvidersDir=<dir>.
    systemProperty("exampleserver.orgProvidersDir",
        (project.findProperty("orgProvidersDir") ?: layout.buildDirectory.dir("orgProviders").get().asFile.absolutePath).toString())
}
