// A thin, standalone Provider jar for the :examples showcase. Mirrors stub-auth's
// stub-provider: the Provider SPI is supplied by the HOST at runtime (:jvm's ProviderRegistry
// loads this jar on a URLClassLoader parented to its own, which already has :routing's
// Provider/ProxyHandler/HandlerCtx/HttpRequest/HttpResponse loaded), so :routing is compileOnly.
// `./gradlew :examples-provider:jar` must therefore NOT bundle any io/github/intisy/ai/shared/**
// class inside the jar -- it stays a pure two-Provider + META-INF/services artifact discovered
// purely via ServiceLoader.
dependencies {
    githubCompileOnly "intisy-ai:basekit:5.0.0:routing"
    // The Provider vocabulary these examples implement. compileOnly, like :routing above: the
    // host already has it loaded, so the shipped jar must not carry a copy.
    githubCompileOnly "intisy-ai:basekit:5.0.0:auth-contracts"
    // HandleIrRateLimitedProvider's handleIr override references IrRequest/IrResponse
    // (defined in :ir, not re-exported by :routing's own compileOnly :ir dependency).
    githubCompileOnly "intisy-ai:basekit:5.0.0:ir"

    // The seam interfaces HandlerCtx names, which a release-asset jar does not export transitively.
    githubCompileOnly "intisy:bayonet:1.8.0:contract"
}

// Windows javac defaults to windows-1252, which corrupts non-ASCII string literals; pin UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
